name: Daily Market Diary

on:
  # Schedule: Daily at 04:00 Beijing time (UTC 20:00)
  # Currently using 19:58 UTC (= Beijing 03:58), which is fine
  schedule:
    - cron: "58 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-market-diary-main
  cancel-in-progress: true

jobs:
  run:
    # Avoid actions bot triggering itself on push (if enabled in future)
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    
    env:
      # Force Node.js 24 to avoid deprecation warnings
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with origin/main (before generating)
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r market_diary/requirements.txt

      - name: Debug time & trigger
        env:
          TZ: Asia/Shanghai
        run: |
          echo "event: $GITHUB_EVENT_NAME"
          echo "actor: $GITHUB_ACTOR"
          echo "Beijing time: $(date)"
          echo "UTC time: $(date -u)"

      # Safe: Only check if key is injected successfully + length
      - name: Debug API key presence (safe)
        run: |
          python - <<'PY'
          import os
          for k in ["MINIMAX_API_KEY", "OPENAI_API_KEY"]:
              v = (os.getenv(k) or "").strip()
              print(f"{k}: present={bool(v)}, len={len(v)}")
          for k in ["OPENAI_BASE_URL", "LLM_BASE_URL", "LLM_MODEL"]:
              print(f"{k}: {os.getenv(k)}")
          PY

      - name: Generate diary
        env:
          TZ: Asia/Shanghai

          # Your main Key (create in Repo Settings → Secrets → Actions)
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

          # Fallback: Some code/SDK only recognizes OPENAI_API_KEY
          OPENAI_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

          # base_url: If your Key is created on platform.minimaxi.com, use .com
          # If your Key is created on platform.minimax.io, change to https://api.minimax.io/v1
          OPENAI_BASE_URL: https://api.minimaxi.com/v1
          LLM_BASE_URL: https://api.minimaxi.com/v1

          # Model name
          LLM_MODEL: MiniMax-M2.7
        run: |
          python market_diary/main.py --date "$(date -d 'yesterday' +%F)"

      - name: Commit & push report
        env:
          TZ: Asia/Shanghai
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f reports/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: market diary $(date -d 'yesterday' +%F)"
          git push origin HEAD:main
