name: Daily Morning Briefing (Professional)

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Last completed market data date (YYYY-MM-DD, leave empty for prior HK trading day)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: morning-briefing-professional-main
  cancel-in-progress: true

jobs:
  generate-briefing:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with origin/main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r market_diary/requirements.txt

      - name: Debug environment
        env:
          TZ: Asia/Shanghai
        run: |
          echo "=== Environment Info ==="
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"
          echo "Beijing time: $(date)"
          echo "UTC time: $(date -u)"
          echo ""
          echo "=== Python Info ==="
          python --version
          pip list | grep -E "(pandas|numpy|matplotlib|openai|yfinance)"
          echo ""
          echo "=== API Key Check ==="
          python - <<'PY'
          import os
          for k in ["MINIMAX_API_KEY", "OPENAI_API_KEY"]:
              v = (os.getenv(k) or "").strip()
              print(f"{k}: present={bool(v)}, len={len(v)}")
          for k in ["OPENAI_BASE_URL", "LLM_BASE_URL", "LLM_MODEL"]:
              print(f"{k}: {os.getenv(k)}")
          PY

      - name: Run system tests
        env:
          TZ: Asia/Shanghai
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_BASE_URL: https://api.minimaxi.com/v1
          LLM_BASE_URL: https://api.minimaxi.com/v1
          LLM_MODEL: MiniMax-M2.7
        run: |
          echo "Running system tests..."
          python test_github_actions.py
          python test_stockconnect_ah_premium.py
          python test_report_quality.py
          python test_runtime_audit.py
          python test_hk_local_foundation.py
          python test_hk_flow_attribution.py
          python test_daily_one_chart.py
          python test_market_data_resilience.py
          python test_llm_enhancer_resilience.py
          python test_llm_pipeline.py
          python test_email_delivery.py
          python test_text_normalizer.py
          python test_chart_appendix.py
          python test_news_cache.py
          python test_trend_pack.py
          python test_professional_workbench.py

      - name: Generate Morning Briefing
        env:
          TZ: Asia/Shanghai
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_BASE_URL: https://api.minimaxi.com/v1
          LLM_BASE_URL: https://api.minimaxi.com/v1
          LLM_MODEL: MiniMax-M2.7
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            GLOBAL_DATE="${{ github.event.inputs.date }}"
            HK_DATE="${{ github.event.inputs.date }}"
          else
            GLOBAL_DATE="$(python - <<'PY'
          from datetime import datetime, timedelta
          d = datetime.now().date() - timedelta(days=1)
          while d.weekday() >= 5:
              d -= timedelta(days=1)
          print(d.isoformat())
          PY
          )"
            HK_DATE="$GLOBAL_DATE"
          fi
          BRIEFING_DATE="$(date +%F)"

          echo "Global markets through: $GLOBAL_DATE"
          echo "HK/China local data through: $HK_DATE"
          echo "Briefing date: $BRIEFING_DATE"
          echo "GLOBAL_DATE=$GLOBAL_DATE" >> "$GITHUB_ENV"
          echo "HK_DATE=$HK_DATE" >> "$GITHUB_ENV"
          echo "BRIEFING_DATE=$BRIEFING_DATE" >> "$GITHUB_ENV"
          python market_diary/main_professional.py --global-date "$GLOBAL_DATE" --hk-date "$HK_DATE" --briefing-date "$BRIEFING_DATE"

      - name: Send briefing email
        env:
          REPORT_EMAIL_TO: hongfei_wu7@outlook.com
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "SMTP credentials are not configured; skipping email delivery."
            exit 0
          fi

          python scripts/send_report_email.py \
            --report-date "$BRIEFING_DATE" \
            --output-dir reports_professional \
            --to "$REPORT_EMAIL_TO"

      - name: Commit and push reports
        env:
          TZ: Asia/Shanghai
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f reports_professional/

          if git diff --cached --quiet; then
            echo "No new reports to commit"
            exit 0
          fi

          git commit -m "chore: morning briefing (professional) $BRIEFING_DATE"
          git push origin HEAD:main

          echo "Morning briefing generated and pushed to repository"

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-briefing-${{ github.run_number }}
          path: |
            reports_professional/*.md
            reports_professional/charts/*.png
            reports_professional/charts/*.json
          retention-days: 30
