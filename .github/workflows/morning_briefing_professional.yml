name: Daily Morning Briefing (Professional)

on:
  schedule:
    # 05:17 Hong Kong / Beijing: avoids the congested top of the hour.
    - cron: "17 21 * * *"
    # 06:47 Hong Kong / Beijing: recovery run only when today's archive is absent.
    - cron: "47 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Calendar review date (YYYY-MM-DD, leave empty for automatic resolution)"
        required: false
        type: string
      publish_archive:
        description: "Commit the generated report archive back to main"
        required: false
        default: false
        type: boolean
      deliver:
        description: "Send email and WeCom after a successful manual run"
        required: false
        default: false
        type: boolean
      run_full_tests:
        description: "Run the complete test suite before a manual generation"
        required: false
        default: false
        type: boolean
      include_raw_bundle:
        description: "Include raw bundle JSON in the committed archive"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # Scheduled runs queue instead of cancelling each other. Manual runs on other
  # refs cannot cancel production.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
      REPORT_EMAIL_TO: hongfei_wu7@outlook.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync scheduled run with origin/main
        if: ${{ github.event_name == 'schedule' }}
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Resolve run gate and briefing date
        id: gate
        run: |
          BRIEFING_DATE="$(date +%F)"
          SHOULD_RUN=true
          RUN_KIND=primary

          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "47 22 * * *" ]; then
            RUN_KIND=recovery
            if [ -f "reports_professional/archive/$BRIEFING_DATE/morning_briefing.md" ]; then
              SHOULD_RUN=false
              echo "Primary report is already archived for $BRIEFING_DATE; recovery run is not needed."
            fi
          fi

          echo "BRIEFING_DATE=$BRIEFING_DATE" >> "$GITHUB_ENV"
          echo "DELIVERY_REQUIRED=${{ github.event_name == 'schedule' || inputs.deliver }}" >> "$GITHUB_ENV"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "run_kind=$RUN_KIND" >> "$GITHUB_OUTPUT"
          echo "Run kind: $RUN_KIND | briefing date: $BRIEFING_DATE | execute: $SHOULD_RUN"

      - name: Set up Python
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Validate manual archive target
        if: ${{ steps.gate.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish_archive && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Manual archive publication is allowed only from refs/heads/main."
          exit 1

      - name: Install dependencies
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest==8.3.4
          pip install -e . --no-deps

      - name: Runtime preflight
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.MINIMAX_API_KEY != '' && 'https://api.minimaxi.com/v1' || 'https://api.deepseek.com' }}
          LLM_BASE_URL: ${{ secrets.MINIMAX_API_KEY != '' && 'https://api.minimaxi.com/v1' || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ secrets.MINIMAX_API_KEY != '' && 'MiniMax-M3' || 'deepseek-v4-pro' }}
          LLM_PRIMARY_PROVIDER: ${{ secrets.MINIMAX_API_KEY != '' && 'minimax' || 'deepseek' }}
        run: |
          python --version
          python - <<'PY'
          import os
          for key in ("DEEPSEEK_API_KEY", "MINIMAX_API_KEY"):
              print(f"{key}: configured={bool((os.getenv(key) or '').strip())}")
          print(f"LLM_PRIMARY_PROVIDER: {os.getenv('LLM_PRIMARY_PROVIDER')}")
          print(f"LLM_MODEL: {os.getenv('LLM_MODEL')}")
          PY
          python -m pytest -q tests/test_instruments.py tests/test_market_data_resilience.py

      - name: Run full test suite
        if: ${{ steps.gate.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && inputs.run_full_tests }}
        run: python scripts/run_tests.py --pytest

      - name: Generate morning briefing
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.MINIMAX_API_KEY != '' && 'https://api.minimaxi.com/v1' || 'https://api.deepseek.com' }}
          LLM_BASE_URL: ${{ secrets.MINIMAX_API_KEY != '' && 'https://api.minimaxi.com/v1' || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ secrets.MINIMAX_API_KEY != '' && 'MiniMax-M3' || 'deepseek-v4-pro' }}
          LLM_PRIMARY_PROVIDER: ${{ secrets.MINIMAX_API_KEY != '' && 'minimax' || 'deepseek' }}
        run: |
          echo "Briefing date: $BRIEFING_DATE"
          if [ -n "${{ inputs.date }}" ]; then
            REVIEW_DATE="${{ inputs.date }}"
            market-diary-professional \
              --review-date "$REVIEW_DATE" \
              --global-date "$REVIEW_DATE" \
              --hk-date "$REVIEW_DATE" \
              --briefing-date "$BRIEFING_DATE"
          else
            market-diary-professional --briefing-date "$BRIEFING_DATE"
          fi

      - name: Render delivery previews
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        run: |
          python scripts/send_report_email.py \
            --report-date "$BRIEFING_DATE" \
            --output-dir reports_professional \
            --to "$REPORT_EMAIL_TO" \
            --dry-run
          python scripts/send_report_wecom.py \
            --report-date "$BRIEFING_DATE" \
            --output-dir reports_professional \
            --mode full \
            --dry-run

      - name: Audit generated briefing
        id: audit
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        run: |
          mkdir -p reports_professional
          AUDIT_LOG="reports_professional/audit_${BRIEFING_DATE}.txt"
          if ! python scripts/audit_professional_run.py \
            --report-date "$BRIEFING_DATE" \
            --require-email-preview > "$AUDIT_LOG" 2>&1; then
            cat "$AUDIT_LOG"
            {
              echo "### Runtime audit"
              echo
              echo '```text'
              cat "$AUDIT_LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "$AUDIT_LOG"
          {
            echo "### Runtime audit"
            echo
            echo '```text'
            cat "$AUDIT_LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push report archive
        id: archive
        continue-on-error: true
        if: ${{ steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || (inputs.publish_archive && github.ref == 'refs/heads/main')) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          STAGE_ARGS=(--report-date "$BRIEFING_DATE")
          if [ "${{ inputs.include_raw_bundle }}" = "true" ]; then
            STAGE_ARGS+=(--include-raw-bundle)
          fi
          python scripts/stage_report_archive.py "${STAGE_ARGS[@]}"

          if git diff --cached --quiet; then
            echo "No new reports to commit"
            exit 0
          fi

          git commit -m "chore: morning briefing (professional) $BRIEFING_DATE [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Archive push attempt $attempt failed; retrying after refetch."
          done
          exit 1

      - name: Send briefing email
        id: email
        continue-on-error: true
        if: ${{ steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.deliver) }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "::error::SMTP credentials are incomplete; email delivery failed."
            exit 1
          fi
          python scripts/send_report_email.py \
            --report-date "$BRIEFING_DATE" \
            --output-dir reports_professional \
            --to "$REPORT_EMAIL_TO"

      - name: Send briefing to WeCom
        id: wecom
        continue-on-error: true
        if: ${{ steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.deliver) }}
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: |
          if [ -z "$WECOM_WEBHOOK_URL" ]; then
            echo "::error::WECOM_WEBHOOK_URL is missing; WeCom delivery failed."
            exit 1
          fi
          python scripts/send_report_wecom.py \
            --report-date "$BRIEFING_DATE" \
            --output-dir reports_professional \
            --mode full

      - name: Verify publication outcome
        if: ${{ always() && steps.gate.outputs.should_run == 'true' }}
        run: |
          FAILED=0
          if [ "${{ github.event_name == 'schedule' || (inputs.publish_archive && github.ref == 'refs/heads/main') }}" = "true" ] && [ "${{ steps.archive.outcome }}" != "success" ]; then
            echo "::error::Report generation passed, but archive publication failed."
            FAILED=1
          fi
          if [ "$DELIVERY_REQUIRED" = "true" ] && [ "${{ steps.email.outcome }}" != "success" ] && [ "${{ steps.wecom.outcome }}" != "success" ]; then
            echo "::error::Both email and WeCom delivery failed."
            FAILED=1
          fi
          exit "$FAILED"

      - name: Upload reports as artifacts
        if: ${{ always() && steps.gate.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: morning-briefing-${{ github.run_number }}-${{ steps.gate.outputs.run_kind }}
          path: |
            reports_professional/*.md
            reports_professional/*.html
            reports_professional/charts/*.png
            reports_professional/charts/*.json
            reports_professional/performance/*
            reports_professional/raw/*.json
            reports_professional/audit_*.txt
          retention-days: 30
