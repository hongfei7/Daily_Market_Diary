name: Daily Morning Briefing (Professional)

on:
  schedule:
    # 23:00 UTC = 07:00 Hong Kong / Beijing time, leaving a 30-minute buffer before the 07:30 target.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Calendar review date (YYYY-MM-DD, leave empty for yesterday in Hong Kong time)"
        required: false
        type: string
      publish_archive:
        description: "Commit the generated report archive back to main"
        required: false
        default: false
        type: boolean
      include_raw_bundle:
        description: "Include raw bundle JSON in the committed archive"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: morning-briefing-professional-main
  cancel-in-progress: true

jobs:
  generate-briefing:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync with origin/main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main || {
            echo "Fast-forward pull failed; resetting to origin/main as fallback."
            git reset --hard origin/main
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest==8.3.4
          pip install -e . --no-deps

      - name: Debug environment
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.MINIMAX_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.DEEPSEEK_API_KEY != '' && 'http://api.deepseek.com' || 'https://api.minimaxi.com/v1' }}
          LLM_BASE_URL: ${{ secrets.DEEPSEEK_API_KEY != '' && 'http://api.deepseek.com' || 'https://api.minimaxi.com/v1' }}
          LLM_MODEL: ${{ secrets.DEEPSEEK_API_KEY != '' && 'deepseek-v4-pro' || 'MiniMax-M2.7' }}
        run: |
          echo "=== Environment Info ==="
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"
          echo "Beijing time: $(date)"
          echo "UTC time: $(date -u)"
          echo ""
          echo "=== Python Info ==="
          python --version
          pip list | grep -E "(pandas|numpy|matplotlib|openai|yfinance)"
          echo ""
          echo "=== API Key Check ==="
          python - <<'PY'
          import os
          for k in ["DEEPSEEK_API_KEY", "MINIMAX_API_KEY", "OPENAI_API_KEY"]:
              v = (os.getenv(k) or "").strip()
              print(f"{k}: present={bool(v)}, len={len(v)}")
          for k in ["OPENAI_BASE_URL", "LLM_BASE_URL", "LLM_MODEL"]:
              print(f"{k}: {os.getenv(k)}")
          PY

      - name: Run system tests
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.MINIMAX_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.DEEPSEEK_API_KEY != '' && 'http://api.deepseek.com' || 'https://api.minimaxi.com/v1' }}
          LLM_BASE_URL: ${{ secrets.DEEPSEEK_API_KEY != '' && 'http://api.deepseek.com' || 'https://api.minimaxi.com/v1' }}
          LLM_MODEL: ${{ secrets.DEEPSEEK_API_KEY != '' && 'deepseek-v4-pro' || 'MiniMax-M2.7' }}
        run: |
          echo "Running system tests..."
          python scripts/run_tests.py --pytest

      - name: Generate Morning Briefing
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.MINIMAX_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.DEEPSEEK_API_KEY != '' && 'http://api.deepseek.com' || 'https://api.minimaxi.com/v1' }}
          LLM_BASE_URL: ${{ secrets.DEEPSEEK_API_KEY != '' && 'http://api.deepseek.com' || 'https://api.minimaxi.com/v1' }}
          LLM_MODEL: ${{ secrets.DEEPSEEK_API_KEY != '' && 'deepseek-v4-pro' || 'MiniMax-M2.7' }}
        run: |
          BRIEFING_DATE="$(date +%F)"
          echo "BRIEFING_DATE=$BRIEFING_DATE" >> "$GITHUB_ENV"
          echo "Briefing date: $BRIEFING_DATE"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            REVIEW_DATE="${{ github.event.inputs.date }}"
            GLOBAL_DATE="$REVIEW_DATE"
            HK_DATE="$REVIEW_DATE"
            echo "Manual review date: $REVIEW_DATE"
            echo "Manual global market request date: $GLOBAL_DATE"
            echo "Manual HK/China local request date: $HK_DATE"
            market-diary-professional --review-date "$REVIEW_DATE" --global-date "$GLOBAL_DATE" --hk-date "$HK_DATE" --briefing-date "$BRIEFING_DATE"
          else
            echo "Scheduled run: letting main_professional.py resolve review/global/HK dates."
            market-diary-professional --briefing-date "$BRIEFING_DATE"
          fi

      - name: Audit generated briefing
        env:
          TZ: Asia/Shanghai
        run: |
          set +e
          mkdir -p reports_professional
          AUDIT_LOG="reports_professional/audit_${BRIEFING_DATE}.txt"
          python scripts/audit_professional_run.py --report-date "$BRIEFING_DATE" > "$AUDIT_LOG" 2>&1
          AUDIT_STATUS=$?
          cat "$AUDIT_LOG"
          {
            echo "### Runtime audit"
            echo
            echo '```text'
            cat "$AUDIT_LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUDIT_STATUS" -ne 0 ]; then
            echo "::warning::Audit found issues (exit code $AUDIT_STATUS); continuing with delivery."
          fi

      - name: Send briefing email
        env:
          REPORT_EMAIL_TO: hongfei_wu7@outlook.com
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "SMTP credentials are not configured; skipping email delivery."
            exit 0
          fi

          python scripts/send_report_email.py \
            --report-date "$BRIEFING_DATE" \
            --output-dir reports_professional \
            --to "$REPORT_EMAIL_TO"

      - name: Commit and push report archive
        if: ${{ github.event_name == 'schedule' || github.event.inputs.publish_archive == 'true' }}
        env:
          TZ: Asia/Shanghai
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git merge --ff-only origin/main || {
            echo "Fast-forward merge failed; resetting to origin/main as fallback."
            git reset --hard origin/main
          }

          STAGE_ARGS=(--report-date "$BRIEFING_DATE" --include-all-charts)
          if [ "${{ github.event.inputs.include_raw_bundle }}" = "true" ]; then
            STAGE_ARGS+=(--include-raw-bundle)
          fi
          python scripts/stage_report_archive.py "${STAGE_ARGS[@]}"

          if git diff --cached --quiet; then
            echo "No new reports to commit"
            exit 0
          fi

          git commit -m "chore: morning briefing (professional) $BRIEFING_DATE [skip ci]"
          git push origin HEAD:main

          echo "Morning briefing generated and pushed to repository"

      - name: Send briefing to WeCom
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: |
          if [ -z "$WECOM_WEBHOOK_URL" ]; then
            echo "WECOM_WEBHOOK_URL is not configured; skipping WeCom delivery."
            exit 0
          fi
          python scripts/send_report_wecom.py \
            --report-date "$BRIEFING_DATE" \
            --output-dir reports_professional \
            --mode full

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: morning-briefing-${{ github.run_number }}
          path: |
            reports_professional/*.md
            reports_professional/*.html
            reports_professional/charts/*.png
            reports_professional/charts/*.json
            reports_professional/raw/*.json
            reports_professional/audit_*.txt
          retention-days: 30
