name: Daily Morning Briefing (Professional)

on:
  # Schedule: Daily at 06:00 Beijing time (UTC 22:00) - Generate before market open
  schedule:
    - cron: "0 22 * * *"
  # Manual trigger
  workflow_dispatch:
    inputs:
      date:
        description: 'Report date (YYYY-MM-DD, leave empty for yesterday)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: morning-briefing-professional-main
  cancel-in-progress: true

jobs:
  generate-briefing:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    
    env:
      # Force Node.js 24 to avoid deprecation warnings
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with origin/main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r market_diary/requirements.txt

      - name: Debug environment
        env:
          TZ: Asia/Shanghai
        run: |
          echo "=== Environment Info ==="
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"
          echo "Beijing time: $(date)"
          echo "UTC time: $(date -u)"
          echo ""
          echo "=== Python Info ==="
          python --version
          pip list | grep -E "(pandas|numpy|matplotlib|openai|yfinance)"
          echo ""
          echo "=== API Key Check ==="
          python - <<'PY'
          import os
          for k in ["MINIMAX_API_KEY", "OPENAI_API_KEY"]:
              v = (os.getenv(k) or "").strip()
              print(f"{k}: present={bool(v)}, len={len(v)}")
          for k in ["OPENAI_BASE_URL", "LLM_BASE_URL", "LLM_MODEL"]:
              print(f"{k}: {os.getenv(k)}")
          PY

      - name: Run system tests
        env:
          TZ: Asia/Shanghai
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_BASE_URL: https://api.minimaxi.com/v1
          LLM_BASE_URL: https://api.minimaxi.com/v1
          LLM_MODEL: MiniMax-M2.7
        run: |
          echo "Running system tests..."
          python test_github_actions.py

      - name: Generate Morning Briefing
        env:
          TZ: Asia/Shanghai
          # API Configuration
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_BASE_URL: https://api.minimaxi.com/v1
          LLM_BASE_URL: https://api.minimaxi.com/v1
          LLM_MODEL: MiniMax-M2.7
        run: |
          # Determine report date
          if [ -n "${{ github.event.inputs.date }}" ]; then
            REPORT_DATE="${{ github.event.inputs.date }}"
          else
            REPORT_DATE="$(date -d 'yesterday' +%F)"
          fi
          
          echo "Report date: $REPORT_DATE"
          
          # Run professional morning briefing generator
          python market_diary/main_professional.py --date "$REPORT_DATE"

      - name: Commit and push reports
        env:
          TZ: Asia/Shanghai
        run: |
          set -e
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add professional reports
          git add -f reports_professional/
          
          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No new reports to commit"
            exit 0
          fi
          
          # Commit and push
          REPORT_DATE="$(date -d 'yesterday' +%F)"
          git commit -m "chore: morning briefing (professional) $REPORT_DATE"
          git push origin HEAD:main
          
          echo "✅ Morning briefing generated and pushed to repository"

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-briefing-${{ github.run_number }}
          path: |
            reports_professional/*.md
            reports_professional/charts/*.png
            reports_professional/charts/*.json
          retention-days: 30
